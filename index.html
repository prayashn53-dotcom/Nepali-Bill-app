<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nepali Bill</title>
<style>
:root{--ac:#4f46e5;--bg:#f1f3f9;--cd:#fff;--tx:#1e2235;--mu:#6b7189;--bd:#e3e6f0;--ok:#16a34a;--wa:#d97706;--er:#dc2626;--sh:0 2px 10px rgba(30,34,53,.08)}
[data-theme=dark]{--bg:#0f1220;--cd:#191d31;--tx:#e8eaf6;--mu:#98a0c0;--bd:#2b3050}
*{box-sizing:border-box;margin:0}html,body{overflow-x:hidden}
body{font:16px/1.45 system-ui,"Segoe UI",Roboto,"Noto Sans Devanagari",sans-serif;background:var(--bg);color:var(--tx);padding-bottom:80px}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--cd);min-height:44px}
label{display:block;font-size:.78rem;color:var(--mu);font-weight:600}label>*{margin-top:4px;font-weight:400;font-size:1rem}
header{position:sticky;top:0;z-index:10;background:linear-gradient(135deg,var(--ac),#7c3aed);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px}
.logo{width:48px;height:48px;border-radius:50%;overflow:hidden;flex:none;background:#fff;color:var(--ac);display:grid;place-items:center;font-weight:800}
header b{flex:1;line-height:1.1}header small{display:block;font-size:.65rem;opacity:.85;font-weight:400}
.chip{background:#fff3;border:0;color:#fff;border-radius:10px;min-height:40px;padding:0 12px;cursor:pointer}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 14px;background:var(--bg);position:sticky;top:68px;z-index:9;scrollbar-width:none}
nav a{white-space:nowrap;padding:9px 14px;border-radius:99px;background:var(--cd);color:var(--mu);font-weight:600;font-size:.85rem;cursor:pointer;box-shadow:var(--sh)}
nav a.on{background:var(--ac);color:#fff}
#view{padding:4px 14px 20px;max-width:1100px;margin:auto}
.card{background:var(--cd);border-radius:16px;padding:16px;box-shadow:var(--sh);margin-bottom:14px}.card h3{font-size:1rem;margin-bottom:10px}
.hero{background:linear-gradient(135deg,var(--ac),#7c3aed);color:#fff}.hero p{opacity:.85;margin:4px 0 12px}
.btn{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:0 16px;min-height:44px;font-weight:600;cursor:pointer;transition:.15s}
.btn:hover{filter:brightness(1.12);transform:translateY(-1px)}.btn.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}.btn.r{background:var(--er)}.btn.s{min-height:36px;padding:0 10px;font-size:.82rem}.hero .btn{background:#fff;color:var(--ac)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.stat{background:var(--cd);border-radius:16px;padding:14px;box-shadow:var(--sh);min-width:0}.stat small{color:var(--mu);font-size:.74rem;font-weight:600}.stat b{display:block;font-size:1.1rem;margin-top:3px;overflow-wrap:anywhere}
.tools{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}.tools input{flex:1 1 150px}.tools select{flex:0 1 150px}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--bd);flex-wrap:wrap}.row:last-child{border:0}
.row .i{flex:1 1 180px;min-width:0}.row small{display:block;color:var(--mu)}.acts{display:flex;gap:6px;flex-wrap:wrap}
.badge{font-size:.7rem;font-weight:700;padding:3px 9px;border-radius:99px}.Paid{background:#16a34a22;color:var(--ok)}.Part{background:#d9770622;color:var(--wa)}.Due{background:#dc262622;color:var(--er)}
.empty{text-align:center;color:var(--mu);padding:28px 8px}
.fg{display:grid;gap:12px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bars .b{margin:9px 0;font-size:.85rem}.bars .b div:first-child{display:flex;justify-content:space-between;gap:8px}.bars .t{height:10px;background:var(--bg);border-radius:9px;overflow:hidden;margin-top:3px}.bars .t i{display:block;height:100%;background:var(--ac);border-radius:9px}
.legal{font-size:.78rem;color:var(--mu);background:var(--bg);padding:10px;border-radius:10px;margin-top:10px}
.fab{position:fixed;right:16px;bottom:16px;z-index:20;box-shadow:0 6px 18px #4f46e566;border-radius:99px;min-height:52px;padding:0 22px}
#modal{position:fixed;inset:0;background:#0009;z-index:50;display:flex;align-items:flex-end;justify-content:center}#modal[hidden]{display:none}
.mbox{background:var(--cd);width:100%;max-width:780px;max-height:94vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px}
.mbox h3{margin-bottom:12px}
.item{border:1px solid var(--bd);border-radius:12px;padding:10px;margin-bottom:10px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.item>label:first-child{grid-column:1/-1}.item .btn{grid-column:1/-1}
.tot{background:var(--bg);border-radius:12px;padding:12px;margin:10px 0}.tot div{display:flex;justify-content:space-between;padding:2px 0}.tot .g{font-weight:800;font-size:1.1rem}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.sticky{position:sticky;bottom:-16px;background:var(--cd);padding:10px 0}
#toasts{position:fixed;top:12px;left:12px;right:12px;z-index:99;display:grid;gap:8px;justify-items:center;pointer-events:none}.toast{background:#111827;color:#fff;padding:10px 16px;border-radius:10px}.toast.e{background:var(--er)}
/* invoice sheet (always white for printing) */
.sheet{background:#fff;color:#111;padding:20px;border:1px solid #ddd;border-radius:8px;font-size:.86rem;overflow-x:auto}
.sheet .hd{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--ac);color:#fff;margin:-20px -20px 14px;padding:18px 20px;border-radius:8px 8px 0 0}
.sheet h2{font-size:1.3rem;letter-spacing:1px}.sheet table{width:100%;border-collapse:collapse;margin:10px 0;min-width:360px}
.sheet th,.sheet td{padding:7px 6px;text-align:right;border-bottom:1px solid #ddd}.sheet th:first-child,.sheet td:first-child{text-align:left}.sheet th{background:#eef0ff;color:var(--ac)}
.sheet .tt{margin-left:auto;width:240px;max-width:100%}.sheet .tt div{display:flex;justify-content:space-between;padding:3px 0}.sheet .ty{font-weight:800;border-top:2px solid var(--ac);color:var(--ac)}
@media print{#app{display:block}body.mo #app,header,nav,.fab,.noprint{display:none!important}body:not(.mo) #modal{display:none}#modal{position:static;background:none;display:block}.mbox{max-height:none;padding:0;overflow:visible}.sheet{border:0}.sheet,.sheet *{-webkit-print-color-adjust:exact;print-color-adjust:exact}@page{size:A4;margin:12mm}}
@media(min-width:800px){.grid{grid-template-columns:repeat(4,1fr)}#modal{align-items:center}.mbox{border-radius:18px}.item{grid-template-columns:3fr 1fr 1.2fr 1fr auto}.item>label:first-child{grid-column:auto}.item .btn{grid-column:auto;align-self:end}}
</style></head><body>
<div id="app"><header><div class="logo">NB</div><b>Nepali Bill<small>Simple Billing. Smarter Records.</small></b><button class="chip" data-a="lang" id="lb"></button><button class="chip" data-a="theme">◐</button><button class="chip" data-a="acct" id="ub"></button></header>
<nav id="nav"></nav><main id="view"></main><button class="btn fab" data-a="new" id="fab"></button></div>
<div id="modal" hidden><div class="mbox" id="mc"></div></div><div id="toasts"></div><input type="file" id="imp" accept=".json" hidden>
<script>
/* Nepali Bill – single-file free local billing tool. Data is stored only in this browser/device. */
const K='nb2',$=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const DEF={set:{name:'My Shop',addr:'',phone:'',pan:'',cur:'Rs.',vat:true,rate:13,lang:'en',theme:'light',foot:'Thank you for your business!'},docs:[]};
let USER=null,db;try{USER=JSON.parse(localStorage.getItem('nb2.user'))}catch(e){}
const GOOGLE_CLIENT_ID='';/* optional: paste your Google Client ID here */
const dk=()=>K+':'+(USER?USER.email:'guest');
function loadDb(){let d=null;try{d=JSON.parse(localStorage.getItem(dk()))}catch(e){}if(!d&&(!USER||USER.email=='guest')){try{d=JSON.parse(localStorage.getItem(K))}catch(e){}}d=d||structuredClone(DEF);d.set={...DEF.set,...d.set};d.docs=d.docs||[];d.cash=d.cash||[];db=d}
loadDb();
const sv=()=>{try{localStorage.setItem(dk(),JSON.stringify(db))}catch(e){toast('Storage unavailable',1)}};
const NE={'Dashboard':'ड्यासबोर्ड','Sales List':'बिक्री सूची','Sales Orders':'बिक्री अर्डर','Purchases':'खरिद सूची','Sales Report':'बिक्री प्रतिवेदन','Management Report':'व्यवस्थापन प्रतिवेदन','Settings':'सेटिङ','New':'नयाँ','Total Sales':'कुल बिक्री','Paid':'भुक्तानी भएको','Due':'बाँकी','Partially Paid':'आंशिक भुक्तानी','Save':'सुरक्षित गर्नुहोस्','Cancel':'रद्द','Search':'खोज्नुहोस्','Edit':'सम्पादन','Delete':'मेट्नुहोस्','Print':'प्रिन्ट','Preview':'हेर्नुहोस्','Subtotal':'उप-जम्मा','Discount':'छुट','Grand Total':'कुल जम्मा','Amount Due':'बाँकी रकम','Total Paid':'कुल भुक्तानी','Total Due':'कुल बाँकी','Invoices':'बिलहरू','Collected':'संकलित','Outstanding':'बाँकी रकम','Total Purchases':'कुल खरिद','Gross Profit':'कुल नाफा','VAT Payable':'तिर्नुपर्ने मू.अ.कर','Receivable':'लिनुपर्ने','Payable':'तिर्नुपर्ने','Pending Orders':'बाँकी अर्डर','Top Products':'शीर्ष सामान','Top Customers':'शीर्ष ग्राहक','Top Suppliers':'शीर्ष आपूर्तिकर्ता','Welcome':'स्वागत छ','Customer':'ग्राहक','Supplier':'आपूर्तिकर्ता','Date':'मिति','Notes':'टिप्पणी','Add item':'सामान थप्नुहोस्','Qty':'परिमाण','Rate':'दर','Amount':'रकम','Total':'जम्मा','Today':'आज','This week':'यो हप्ता','This month':'यो महिना','This year':'यो वर्ष','All time':'सबै समय','To Sale':'बिक्रीमा बदल्नुहोस्','Duplicate':'नक्कल','VAT':'मू.अ.कर','Sales Invoice':'बिक्री बिल','Sales Order':'बिक्री अर्डर','Purchase Bill':'खरिद बिल','Print / Save PDF':'प्रिन्ट / PDF सेभ','Estimates':'अनुमानित बिल','Estimate':'अनुमानित बिल','Cashbook':'क्यासबुक','Voucher':'भौचर','Cash In':'नगद आम्दानी','Cash Out':'नगद खर्च','Balance':'मौज्दात','Sign out':'लगआउट'};
const t=k=>db.set.lang=='ne'&&NE[k]||k;
const TY={sale:{p:'INV-',l:'Sales List',n:'Sales Invoice',who:'Customer'},order:{p:'SO-',l:'Sales Orders',n:'Sales Order',who:'Customer'},estimate:{p:'EST-',l:'Estimates',n:'Estimate',who:'Customer'},purchase:{p:'PO-',l:'Purchases',n:'Purchase Bill',who:'Supplier'}};
const fmt=n=>db.set.cur+' '+(+n||0).toLocaleString('en-IN',{maximumFractionDigits:2}),today=()=>new Date().toISOString().slice(0,10),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
function toast(m,e){const d=document.createElement('div');d.className='toast'+(e?' e':'');d.textContent=m;$('#toasts').append(d);setTimeout(()=>d.remove(),2600)}
/* automatic calculations (13% VAT optional per document) */
function calc(d){const sub=d.items.reduce((a,x)=>a+x.q*x.r,0),disc=d.items.reduce((a,x)=>a+(+x.d||0),0),net=sub-disc,vat=d.vat?net*db.set.rate/100:0,total=net+vat;return{sub,disc,net,vat,total,due:Math.max(0,total-d.paid)}}
const st=d=>{const c=calc(d);return c.due<=0&&c.total>0?'Paid':d.paid>0?'Part':'Due'},stl={Paid:'Paid',Part:'Partially Paid',Due:'Due'};
const badge=d=>`<span class="badge ${st(d)}">${t(stl[st(d)])}</span>`;
const nextNo=ty=>{const n=Math.max(0,...db.docs.filter(d=>d.t==ty).map(d=>parseInt(d.no.replace(/\D/g,''))||0))+1;return TY[ty].p+String(n).padStart(4,'0')};
const S={v:'Dashboard',q:'',per:'All time'};
const NAV=['Dashboard','sale','estimate','order','purchase','Cashbook','Sales Report','Management Report','Settings'];
const navL=n=>TY[n]?t(TY[n].l):t(n);
function render(){const r=document.documentElement;r.dataset.theme=db.set.theme;$('#ub').textContent='👤 '+(USER?USER.name.split(' ')[0].slice(0,9):'');$('.logo').innerHTML=db.set.logo?'<img src="'+db.set.logo+'" style="width:100%;height:100%;object-fit:cover;border-radius:50%">':'NB';$('#lb').textContent=db.set.lang=='ne'?'English':'नेपाली';
 $('#nav').innerHTML=NAV.map(n=>`<a data-a="go" data-id="${n}" class="${S.v==n?'on':''}">${navL(n)}</a>`).join('');
 $('#fab').textContent='+ '+(S.v=='Cashbook'?t('Voucher'):TY[S.v]?t(TY[S.v].n):t('Sales Invoice'));$('#view').innerHTML=V[TY[S.v]?'list':S.v]()}
/* report helpers */
function inR(d){const n=new Date(),x=new Date(d),td=today();return{'Today':d==td,'This week':(n-x)/864e5<7&&x<=n,'This month':d.slice(0,7)==td.slice(0,7),'This year':d.slice(0,4)==td.slice(0,4),'All time':true}[S.per]}
const of=ty=>db.docs.filter(d=>d.t==ty&&inR(d.date));
const agg=L=>L.reduce((a,d)=>{const c=calc(d);a.net+=c.net;a.vat+=c.vat;a.total+=c.total;a.paid+=d.paid;a.due+=c.due;a.n++;return a},{net:0,vat:0,total:0,paid:0,due:0,n:0});
const stat=(l,v)=>`<div class="stat"><small>${t(l)}</small><b>${v}</b></div>`;
const bar=(l,v,m,x)=>`<div class="b"><div><span>${E(l)}</span><b>${x??v}</b></div><div class="t"><i style="width:${m?Math.round(v/m*100):0}%"></i></div></div>`;
const empty=m=>`<div class="empty">📄<p>${m}</p></div>`;
const topN=(L,f)=>{const o={};L.forEach(d=>f(d,o));return Object.entries(o).sort((a,b)=>b[1]-a[1]).slice(0,5)};
const topBars=a=>a.length?a.map(([n,v])=>bar(n,v,a[0][1],fmt(v))).join(''):empty('No data');
const perSel=()=>`<div class="tools noprint"><select id="per">${['Today','This week','This month','This year','All time'].map(o=>`<option value="${o}" ${S.per==o?'selected':''}>${t(o)}</option>`).join('')}</select><button class="btn g" data-a="printpage">${t('Print / Save PDF')}</button></div>`;
const row=d=>`<div class="row"><div class="i"><b>${E(d.no)} · ${E(d.party||'—')}</b><small>${d.date} · ${fmt(calc(d).total)}</small></div>${badge(d)}<div class="acts"><button class="btn g s" data-a="view" data-id="${d.id}">${t('Preview')}</button><button class="btn g s" data-a="edit" data-id="${d.id}">${t('Edit')}</button>${d.t=='order'||d.t=='estimate'?`<button class="btn s" data-a="tosale" data-id="${d.id}">${t('To Sale')}</button>`:''}<button class="btn g s" data-a="dup" data-id="${d.id}">${t('Duplicate')}</button><button class="btn r s" data-a="del" data-id="${d.id}">✕</button></div></div>`;
function lst(){const q=S.q.toLowerCase(),L=db.docs.filter(d=>d.t==S.v&&(!q||(d.no+d.party+d.phone).toLowerCase().includes(q))).reverse();return L.length?L.map(row).join(''):empty('Nothing here yet.')}
const V={
Dashboard(){const s=db.docs.filter(d=>d.t=='sale'),a=agg(s),td=today(),m=td.slice(0,7);
 return `<div class="card hero"><h3>${t('Welcome')}, ${E(db.set.name)} 👋</h3><p>Simple Billing. Smarter Records.</p><button class="btn" data-a="new">+ ${t('Sales Invoice')}</button> <button class="btn" data-a="newt" data-id="purchase">+ ${t('Purchase Bill')}</button></div>
 <div class="grid">${stat('Total Sales',fmt(a.total))}${stat('Total Paid',fmt(a.paid))}${stat('Total Due',fmt(a.due))}${stat('Invoices',a.n)}${stat('Today',fmt(agg(s.filter(d=>d.date==td)).total))}${stat('This month',fmt(agg(s.filter(d=>d.date.startsWith(m))).total))}${stat('Total Purchases',fmt(agg(db.docs.filter(d=>d.t=='purchase')).total))}${stat('Pending Orders',db.docs.filter(d=>d.t=='order').length)}</div>
 <div class="card"><h3>${t('Sales List')}</h3>${s.length?[...s].reverse().slice(0,5).map(row).join(''):empty('No invoices yet.')}</div>`},
list(){return `<div class="tools"><input id="q" placeholder="${t('Search')}…" value="${E(S.q)}"></div><div class="card" id="list">${lst()}</div>`},
'Sales Report'(){const L=of('sale'),a=agg(L),by={};L.forEach(d=>by[d.date]=(by[d.date]||0)+calc(d).total);const days=Object.entries(by).sort().slice(-10),mx=Math.max(0,...days.map(x=>x[1]));
 return perSel()+`<div class="grid">${stat('Total Sales',fmt(a.total))}${stat('VAT',fmt(a.vat))}${stat('Collected',fmt(a.paid))}${stat('Outstanding',fmt(a.due))}</div>
 <div class="card bars"><h3>${t('Sales Report')} – ${a.n} ${t('Invoices')}</h3>${days.length?days.map(([d,v])=>bar(d,v,mx,fmt(v))).join(''):empty('No data')}</div>
 <div class="card bars"><h3>${t('Top Products')}</h3>${topBars(topN(L,(d,o)=>d.items.forEach(x=>o[x.n]=(o[x.n]||0)+x.q*x.r-(+x.d||0))))}</div>
 <div class="card"><h3>${t('Sales List')}</h3>${L.length?[...L].reverse().map(row).join(''):empty('No data')}</div>`},
'Management Report'(){const s=agg(of('sale')),p=agg(of('purchase')),o=of('order').filter(d=>d.t=='order'),ov=o.reduce((a,d)=>a+calc(d).total,0);
 return perSel()+`<div class="grid">${stat('Total Sales',fmt(s.total))}${stat('Total Purchases',fmt(p.total))}${stat('Gross Profit',fmt(s.net-p.net))}${stat('VAT Payable',fmt(s.vat-p.vat))}${stat('Receivable',fmt(s.due))}${stat('Payable',fmt(p.due))}${stat('Pending Orders',o.length+' · '+fmt(ov))}${stat('VAT','+'+fmt(s.vat)+' / −'+fmt(p.vat))}</div>
 <div class="card bars"><h3>${t('Total Sales')} vs ${t('Total Purchases')}</h3>${bar(t('Total Sales'),s.total,Math.max(s.total,p.total),fmt(s.total))}${bar(t('Total Purchases'),p.total,Math.max(s.total,p.total),fmt(p.total))}</div>
 <div class="card bars"><h3>${t('Top Customers')}</h3>${topBars(topN(of('sale'),(d,o)=>o[d.party||'Walk-in']=(o[d.party||'Walk-in']||0)+calc(d).total))}</div>
 <div class="card bars"><h3>${t('Top Suppliers')}</h3>${topBars(topN(of('purchase'),(d,o)=>o[d.party||'—']=(o[d.party||'—']||0)+calc(d).total))}</div>
 <p class="legal">Gross profit = sales (before VAT) − purchases (before VAT) for the selected period. It is an estimate, not a tax filing.</p>`},
Settings(){const s=db.set,f=(k,l,tp='text')=>`<label>${l}<input id="s_${k}" type="${tp}" value="${E(s[k])}"></label>`;
 return `<div class="card"><h3>Business</h3><div class="fg">${f('name','Business / Shop name')}${f('addr','Address')}${f('phone','Phone')}${f('pan','PAN / VAT no. (optional)')}${f('cur','Currency')}${f('foot','Invoice footer')}<label>Shop logo (image)<input type="file" id="lg" accept="image/*"></label>${s.logo?`<div><img src="${s.logo}" style="width:90px;height:90px;object-fit:cover;border-radius:50%"> <button class="btn g s" data-a="rmlogo">Remove logo</button></div>`:''}</div></div>
 <div class="card"><h3>VAT</h3><div class="two"><label>New documents include VAT by default<select id="s_vat"><option value="1">On</option><option value="0" ${s.vat?'':'selected'}>Off</option></select></label>${f('rate','VAT rate %','number')}</div></div>
 <button class="btn" data-a="saveset" style="width:100%">${t('Save')}</button>
 <div class="card" style="margin-top:14px"><h3>Data</h3><div class="bar"><button class="btn g" data-a="export">Export JSON</button><button class="btn g" data-a="import">Import JSON</button><button class="btn r" data-a="clear">Clear all data</button></div>
 <p class="legal">🔒 Data is stored only in this browser on this device. Nothing is sent online; no analytics. Export backups regularly.<br><br>This application is a free local invoice and record-keeping tool. It is not presented as an IRD-approved electronic billing system.</p></div>`}};
/* modal */
let CB=null,ED=null;const modal=h=>{$('#mc').innerHTML=h;$('#modal').hidden=false;document.body.classList.add('mo')},close=()=>{$('#modal').hidden=true;document.body.classList.remove('mo');ED=null};
const ask=(m,f)=>{CB=f;modal(`<h3>Please confirm</h3><p>${m}</p><div class="bar"><button class="btn g" data-a="close">${t('Cancel')}</button><button class="btn r" data-a="yes">${t('Delete')}</button></div>`)};
/* editor */
function editor(ty,id){const o=id&&db.docs.find(x=>x.id==id);ED=o?structuredClone(o):{id:uid(),t:ty,no:nextNo(ty),date:today(),party:'',phone:'',items:[{n:'',q:1,r:0,d:0}],vat:db.set.vat,paid:0,notes:''};
 const T=TY[ED.t],uq=f=>[...new Set(db.docs.filter(d=>d.t==ED.t||f=='n').flatMap(d=>f=='n'?d.items.map(x=>x.n):[d.party]).filter(Boolean))].map(v=>`<option value="${E(v)}">`).join('');
